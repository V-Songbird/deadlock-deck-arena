<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Deadlock Deck: El Reloj Anatómico</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="app">

  <header id="hud">
    <div id="clock"><span id="clock-value">6:00</span></div>
    <div id="vitals">
      <div id="hp-bar"><div id="hp-fill"></div><span id="hp-text">30/30</span></div>
      <span id="cycle-text">Ciclo 1</span>
    </div>
    <button id="btn-sound" type="button" aria-label="Sonido">&#9834;</button>
    <button id="btn-lang" type="button">EN</button>
  </header>

  <main id="stage">
    <canvas id="scene" width="384" height="216"></canvas>
    <div id="vignette"></div>
  </main>

  <section id="anatomy" aria-label="Anatomía"></section>

  <section id="combat-bar">
    <div id="combat-top">
      <div id="energy-text">3/3</div>
      <div id="combat-log"></div>
      <button id="btn-end-turn" type="button">Terminar turno</button>
    </div>
    <div id="hand"></div>
  </section>

  <nav id="explore-bar" aria-label="Movimiento">
    <button id="btn-w" type="button" aria-label="Oeste">&#9664;</button>
    <div id="explore-mid">
      <button id="btn-n" type="button" aria-label="Norte">&#9650;</button>
      <span id="room-label">Mesa de disección</span>
      <button id="btn-s" type="button" aria-label="Sur">&#9660;</button>
    </div>
    <button id="btn-e" type="button" aria-label="Este">&#9654;</button>
  </nav>

  <div id="dialog" hidden>
    <div id="dialog-panel">
      <h2 id="dialog-title"></h2>
      <p id="dialog-body"></p>
      <div id="dialog-options"></div>
    </div>
  </div>

  <div id="toast" hidden></div>

</div>

<script src="src/i18n.js"></script>
<script src="src/data.js"></script>
<script src="src/body.js"></script>
<script src="src/combat.js"></script>
<script src="src/tower.js"></script>
<script src="src/render.js"></script>
<script src="src/audio.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>
</body>
</html>
