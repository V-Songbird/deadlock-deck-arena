  <style>
/* Deadlock Deck — gótico alquímico, tinta, latón y fósforo. */
:root {

* { box-sizing: border-box; }

  font: 14px/1.5 var(--sans);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  opacity: .022;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, #b8b190 2px, #b8b190 3px);
}
button, input, select { font: inherit; }
button { cursor: pointer; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: not-allowed; }
button, a, input { outline-offset: 5px; }

button { border-radius: 0; }
h1, h2, h3, p { margin: 0; }
.icon { width: 19px; height: 19px; flex: 0 0 auto; display: inline-block; vertical-align: middle; }

.eyebrow .icon { width: 13px; height: 13px; margin-right: 3px; }
.muted, .subtle { color: var(--muted); }

.turn-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 0; }
.energy-display { display: flex; align-items: center; gap: 10px; }
.energy-display > .icon { width: 25px; height: 25px; color: #d0b26e; }
.energy-display > strong { font: 29px var(--serif); color: #dcc796; white-space: nowrap; }
.energy-display strong small { font: 11px var(--sans); color: #939b77; }
.energy-display > div { padding-left: 8px; border-left: 1px solid #39412d; }
.energy-display b { font-weight: 500; font-size: 8px; letter-spacing: 1.2px; color: #b5b896; display: block; }
.energy-display div span { font-size: 8px; color: #879477; display: block; margin-top: 3px; }
.turn-button { min-width: 196px; min-height: 46px; font-size: 11px; }
.turn-button > span { display: flex; align-items: center; gap: 11px; }
.turn-button kbd { color: inherit; border-color: #746941; font-size: 7px; }
.map-panel { padding: 0 14px 17px; }
.floor-stack { margin: 13px 0 18px; display: grid; gap: 5px; }
.floor-row { display: flex; align-items: center; min-height: 34px; gap: 10px; padding: 4px 8px; font-size: 10px; color: #7b886b; border: 1px solid #303b27; background: #192314; }
.floor-numeral { width: 21px; font: 15px var(--serif); color: #91936c; }

.floor-row.completed { opacity: .7; }
.floor-row.completed .icon { color: #a7b890; }
.map-heading { display: flex; justify-content: space-between; color: #939b77; font-size: 7px; letter-spacing: .8px; }
.tower-map { aspect-ratio: 1; position: relative; margin: 9px 0 10px; background: #101a0f; border: 1px solid #323c28; background-image: linear-gradient(#39442917 1px, transparent 1px), linear-gradient(90deg, #39442917 1px, transparent 1px); background-size: 12px 12px; }
.map-links { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-links line { stroke: #465437; stroke-width: 1.5; }
.map-links .visited-link { stroke: #a9995a; stroke-width: 2; }
.map-node { position: absolute; transform: translate(-50%, -50%); width: 24px; height: 24px; display: grid; place-items: center; background: #172012; border: 1px solid #3c472f; color: #919d79; padding: 0; z-index: 1; }
.map-node:disabled { cursor: default; }
.map-node .icon { width: 11px; height: 11px; }
.map-node.seen { background: #273220; border-color: #55613f; }
.map-node.visited { background: #28331e; border-color: #7b7950; color: #c2bc80; }
.map-node.reachable { border-color: #b5a261; color: #d5cca0; box-shadow: 0 0 0 2px #bfa26717; }
.map-node.reachable:hover { background: #5b5930; border-color: #e4cb7f; }
.map-node.current { background: #c3a363; border-color: #efcd83; box-shadow: 0 0 13px #c1a24e44; }
.map-node.current::after { content: ''; position: absolute; inset: -4px; border: 1px solid #7b7846; }
.you-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #e3c880; }
.current .you-dot { background: #252c1a; width: 6px; height: 6px; }
.unknown-dot { display: inline-block; width: 3px; height: 3px; background: #62724e; border-radius: 50%; }
.exit-node { border-color: #869a6a !important; color: #c0d9a4 !important; background: #2a3a23 !important; }
.map-legend { display: flex; justify-content: space-between; gap: 7px; font-size: 8px; color: #939e7d; }
.map-legend > span { display: flex; align-items: center; gap: 5px; }
.map-legend .icon { width: 11px; height: 11px; }
.objective { margin-top: 22px; padding-top: 17px; border-top: 1px solid #35412c; }
.objective .eyebrow { font-size: 8px; letter-spacing: 1px; color: #bbae79; }
.objective p { font: 14px/1.6 var(--serif); color: #c7c3a5; margin-top: 5px; }
.map-tip { display: flex; gap: 8px; align-items: flex-start; margin-top: 17px; padding: 12px 8px; background: #252a18; border: 1px solid #434c2d; color: #a9a580; font-size: 9px; line-height: 1.7; }
.map-tip .icon { width: 14px; height: 14px; margin-top: 2px; color: #bea86d; }
.run-record { border-top: 1px solid #33412a; margin-top: 20px; padding-top: 16px; }
.run-record .eyebrow { font-size: 7px; letter-spacing: 1.1px; }
.run-record > div { display: flex; justify-content: space-between; margin-top: 10px; font-size: 10px; color: #a5b191; }
.run-record strong { color: #cab780; font-weight: 500; }
.game-footer { margin-top: 19px; border-top: 1px solid #313e28; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.journal-preview { display: flex; align-items: center; gap: 9px; background: none; border: none; text-align: left; min-width: 0; color: #9eab8b; font-size: 10px; padding: 4px 0; flex: 1; }
.journal-preview .icon { color: #92966d; width: 14px; height: 14px; }
.journal-preview > span { white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.journal-preview > .icon:last-child { width: 11px; height: 11px; }
.journal-preview:hover { color: #ddcb91; }
.version-label { font-size: 7px; color: #7e8d6c; letter-spacing: 1px; white-space: nowrap; }
.version-label i { display: inline-block; width: 3px; height: 3px; background: #7f8e59; margin: 0 9px 2px; }
.mobile-toolbar { display: none; }

/* Dialogs keep the real-time clock visible. */
.has-modal { overflow: hidden; }
.modal-backdrop { position: fixed; inset: 0; z-index: 50; background: #070f09cb; display: grid; place-items: center; padding: 24px; backdrop-filter: blur(3px); }
.modal { background: #172112; border: 1px solid #7f8050; width: min(640px, 100%); max-height: calc(100dvh - 48px); box-shadow: 0 18px 100px #0009, inset 0 0 0 4px #172112, inset 0 0 0 5px #38452b; display: flex; flex-direction: column; }
.modal.wide-modal { width: min(870px, 100%); }
.modal-header { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding: 23px 26px 20px; border-bottom: 1px solid #3f4b2d; }
.modal-header .eyebrow { font-size: 8px; letter-spacing: 1.6px; color: #c0b27d; }
.modal-header h2 { font: 29px/1.25 var(--serif); margin-top: 5px; color: #e1d8b6; }
.modal-header .btn { flex-shrink: 0; color: #c2c7a5; }
.modal-clock-note { padding: 6px 27px; border-bottom: 1px solid #3b462c; background: #2d311b; color: #c0b780; font-size: 10px; letter-spacing: .4px; display: flex; justify-content: space-between; }
.modal-live-clock { font: 13px monospace; color: var(--gold); }
.modal-body { padding: 23px 26px 26px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #69764a #1d2716; }
.modal-intro { font-size: 12px; color: #bbc4a2; line-height: 1.8; margin-bottom: 18px; }
.modal-intro strong { color: #e2d29d; font-weight: 500; }
.empty-state { text-align: center; padding: 24px 10px 37px; }
.empty-state > .icon { width: 45px; height: 45px; color: #858c5e; }
.empty-state h3 { font: 24px var(--serif); margin: 16px 0 8px; }
.empty-state p { color: #a9b994; font-size: 12px; max-width: 370px; margin: auto; line-height: 1.8; }
.inventory-list { display: grid; gap: 10px; }
.inventory-item { display: flex; gap: 15px; padding: 17px 14px; border: 1px solid #445233; background: #1f2b18; margin-top: 9px; }
.inventory-symbol { display: flex; align-items: flex-start; padding-top: 20px; }
.inventory-symbol .icon { width: 33px; height: 33px; }
.inventory-description { flex: 1; min-width: 0; }
.inventory-description .eyebrow { font-size: 8px; letter-spacing: .7px; }
.inventory-description h3 { font: 19px var(--serif); color: #ddcfa5; margin-top: 3px; }
.inventory-description p { font-size: 10px; line-height: 1.6; color: #acb99a; margin-top: 5px; }
.inventory-condition { color: #d1b67c; margin-left: 8px; }
.inventory-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.inventory-actions .btn { font-size: 10px; }
.part-stats { display: flex; gap: 23px; justify-content: space-between; margin: 21px 0; padding: 12px; background: #27321c; border: 1px solid #485734; }
.part-stats > span { color: #b9c3a3; font-size: 11px; }
.part-stats .icon { width: 15px; height: 15px; margin-right: 3px; color: #c0ab71; }
.part-stats b { display: block; font: 21px var(--serif); color: #e1d29d; margin: 5px 0 0 21px; }
.lore { font: italic 18px/1.6 var(--serif); color: #cac6a0; }
.detail-cards { display: flex; gap: 15px; max-width: 340px; margin: 23px auto; }
.detail-cards .anatomy-card { min-width: 135px; padding: 11px 12px 0; }
.detail-cards .anatomy-card h3, .deck-grid .anatomy-card h3 { font-size: 16px; }
.detail-cards .anatomy-card p, .deck-grid .anatomy-card p { font-size: 11px; }
.detail-cards .card-art { height: 72px; flex-basis: 72px; }
.section-caption { font: 20px var(--serif); margin-bottom: 15px; }
.deck-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
.deck-grid .anatomy-card { min-height: 235px; }
.deck-grid .card-art { height: 76px; flex-basis: 76px; }
.filter-tabs { display: flex; gap: 7px; margin-bottom: 19px; flex-wrap: wrap; }
.filter-tabs button { border: 1px solid #465535; color: #a3b58e; font-size: 10px; background: #1c2815; min-height: 36px; padding: 7px 13px; }
.filter-tabs button.selected { color: #e3cd8b; background: #3a3f20; border-color: #91814b; }
.blueprint-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.blueprint { padding: 15px; border: 1px solid #4b5b37; background: linear-gradient(135deg, #2b3820, #1e2a17); display: flex; flex-direction: column; }
.blueprint-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.blueprint-top .icon { color: #a1b488; width: 21px; height: 21px; }
.tier { font-size: 7px; letter-spacing: 1.1px; text-transform: uppercase; color: #b4bd95; }
.tier-2 { color: #99b7a3; }
.tier-3 { color: #dec089; }
.blueprint h3 { font: 18px/1.3 var(--serif); color: #dcd4af; }
.blueprint p { font-size: 10px; line-height: 1.75; color: #9aad8a; margin: 8px 0 17px; flex: 1; }
.blueprint .btn { align-self: flex-start; min-height: 34px; font-size: 9px; }
.blueprint.locked { border-style: dashed; background: #182512; opacity: .63; }
.locked .blueprint-top .icon { color: #778760; }
.locked-label { font-size: 6px; letter-spacing: 1px; color: #84986f; }
.shop-notice { display: flex; align-items: flex-start; gap: 12px; background: #24351b; border: 1px solid #4b6139; padding: 15px; font-size: 11px; line-height: 1.7; color: #afc398; margin-bottom: 20px; }
.shop-notice .icon { color: #c4b87e; }
.shop-notice strong { color: #d8d4a2; }
.skin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.skin-card { background: #24321b; border: 1px solid #50613a; padding: 18px; }
.skin-swatch { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #4c5b3477; margin-bottom: 15px; padding-bottom: 11px; }
.skin-swatch .pixel-symbol { width: 52px; height: 52px; opacity: .6; }
.skin-swatch > span { display: grid; place-items: center; width: 58px; height: 58px; color: var(--skin); border: 1px solid var(--skin); background: #182511; }
.skin-swatch > span .icon { width: 38px; height: 38px; }
.skin-card h3 { font: 20px var(--serif); color: #e3d6ab; }
.skin-card p { font-size: 11px; color: #a9bd93; margin: 6px 0 18px; line-height: 1.65; }
.skin-card .equipped { color: #b6c59b; border-color: #617647; background: #2b3d20; }
.expansion-card { margin-top: 20px; padding: 21px; display: flex; gap: 25px; align-items: center; border: 1px solid #8c7950; background: linear-gradient(125deg, #393c20, #27321b); }
.expansion-card h3 { font: 24px var(--serif); color: #dcc88d; margin: 3px 0 9px; }
.expansion-card p { font-size: 11px; line-height: 1.7; color: #b4ba90; }
.expansion-card > .btn { flex-shrink: 0; }
.setting-row { display: flex; justify-content: space-between; align-items: center; gap: 24px; border-bottom: 1px solid #405332; padding: 20px 0; }
.setting-row:first-child { padding-top: 2px; }
.setting-row label, .setting-row > div:first-child { font-size: 14px; color: #d9d9b1; }
.setting-row small { display: block; font-size: 10px; color: #a0b48a; margin-top: 5px; }
.setting-row input[type=checkbox] { width: 22px; height: 22px; accent-color: #c1b874; flex-shrink: 0; cursor: pointer; }
.volume-control { display: flex; align-items: center; gap: 12px; min-width: 170px; }
.volume-control input { accent-color: #c1b874; width: 120px; }
.volume-control output { font: 12px monospace; color: #c1c49a; width: 32px; }
.save-note { display: flex; align-items: flex-start; gap: 10px; margin-top: 21px; padding: 15px; background: #22381c; border: 1px solid #456539; color: #b0cba0; font-size: 11px; line-height: 1.8; }
.save-note .icon { margin-top: 2px; width: 16px; height: 16px; }
.abandon-row { margin-top: 25px; }
.abandon-row p { font-size: 10px; color: #9db58a; margin-top: 8px; }
.confirm-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 25px 0 10px; }
.help-lead { font: 30px/1.3 var(--serif); color: #dfd5ad; margin: 0 0 25px; }
.help-lead em { color: #baa869; }
.help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 30px; }
.help-grid article > span { font: 15px monospace; color: #b39c60; }
.help-grid h3 { font: 21px var(--serif); color: #d5d4a9; margin: 4px 0 7px; }
.help-grid p { font-size: 11px; line-height: 1.85; color: #a8be92; }
.help-grid strong { color: #dccd8f; font-weight: 500; }
.controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 29px; border-top: 1px solid #496336; padding-top: 24px; }
.controls-grid .icon { color: #baa573; width: 24px; height: 24px; }
.controls-grid h3 { font: 19px var(--serif); margin: 6px 0; color: #d3d5a8; }
.controls-grid p { font-size: 11px; line-height: 2; color: #a2bd8d; }
.help-fineprint { font-size: 10px; line-height: 1.8; margin-top: 25px; color: #a4b88b; border-top: 1px solid #476333; padding-top: 15px; }
.journal-list { margin: 0; padding-left: 22px; color: #8ba776; }
.journal-list li { padding: 10px 0 10px 8px; font-size: 12px; color: #bfcea7; line-height: 1.8; border-bottom: 1px solid #3f5a2f; }
.map-modal { width: min(435px, 100%); }
.large-map { max-width: 330px; margin-left: auto; margin-right: auto; }
.large-map .map-node { width: 37px; height: 37px; }
.large-map .map-node .icon { width: 17px; height: 17px; }
.map-modal .floor-row { font-size: 12px; }
.mobile-anatomy { max-width: 400px; margin: auto; }
.mobile-anatomy .panel-title { display: none; }
.mobile-anatomy .anatomy-slots { grid-template-columns: 1fr 1fr; gap: 8px; }
.mobile-anatomy .slot-content > strong { font-size: 11px; }
.mobile-anatomy .body-slot { min-height: 74px; }
.mobile-anatomy .consumables { grid-template-columns: 1fr 1fr; }

/* Opening and the loop's end are playable, not marketing screens. */
.intro-backdrop { background: #07120bad; backdrop-filter: blur(1px); }
.intro-modal { width: min(580px, 100%); text-align: center; background: radial-gradient(ellipse at 50% 20%, #353b239e, transparent 60%), #18220ff5; border: 1px solid #95935c; box-shadow: 0 20px 150px #0009, inset 0 0 0 7px #17220f, inset 0 0 0 8px #4b5630; padding: 34px 40px 27px; max-height: calc(100dvh - 48px); overflow-y: auto; }
.intro-kicker { display: flex; justify-content: center; align-items: center; gap: 11px; color: #b9b986; font-size: 8px; letter-spacing: 2.1px; }
.intro-kicker > span { width: 25px; height: 1px; background: #7c8650; }
.intro-sigil { display: grid; place-items: center; width: 82px; height: 82px; border: 1px solid #8b8750; margin: 25px auto 26px; position: relative; color: #d9c484; border-radius: 50%; background: #7d773013; }
.intro-sigil::before { content: ''; position: absolute; inset: 6px; border: 1px solid #5d6b3c; transform: rotate(45deg); }
.intro-sigil::after { content: ''; position: absolute; inset: -8px; border: 1px solid #697c4244; border-radius: 50%; }
.intro-sigil .icon { width: 40px; height: 40px; position: relative; }
.intro-modal h2 { font: 39px/1.18 var(--serif); letter-spacing: -.75px; color: #e6ddb8; }
.intro-modal h2 em { font-weight: 400; color: #d4b576; }
.intro-modal > p { color: #b9c39d; font-size: 12px; line-height: 1.9; margin-top: 18px; }
.intro-pillars { display: flex; justify-content: center; gap: 26px; margin: 25px 0; color: #b3b986; font-size: 7px; letter-spacing: 1px; }
.intro-pillars .icon { width: 15px; height: 15px; color: #c2b571; margin-right: 5px; }
.intro-start { width: 100%; max-width: 365px; height: 54px; text-transform: uppercase; font-size: 12px; letter-spacing: 3px; }
.intro-start .icon { width: 18px; height: 18px; margin-right: 5px; }
.intro-footer { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.intro-footer > .btn { font-size: 9px; padding: 7px; min-height: 34px; color: #c5c39a; }
.intro-footer > .btn .icon { width: 14px; height: 14px; }
.intro-footer > span { font-size: 8px; color: #9daf83; }
.content-note { color: #889e70; font-size: 8px; display: block; margin-top: 13px; }
.end-modal { width: min(680px, 100%); text-align: center; padding: 37px 40px; border: 1px solid #8e7950; background: radial-gradient(ellipse at 50% 0%, #55402d66, transparent 65%), #202817; box-shadow: inset 0 0 0 6px #202817, inset 0 0 0 7px #525637, 0 15px 100px #0008; max-height: calc(100dvh - 48px); overflow-y: auto; }
.end-modal.won { background: radial-gradient(ellipse at 50% 0%, #82914855, transparent 65%), #24301a; }
.end-symbol { color: #c9ad76; margin-bottom: 20px; }
.end-symbol .icon { width: 51px; height: 51px; }
.end-modal > .eyebrow { font-size: 8px; color: #b7b386; letter-spacing: 1.8px; }
.end-modal h2 { font: 36px/1.3 var(--serif); color: #e0d5ac; margin-top: 9px; }
.end-modal > p { font: 15px/1.8 var(--serif); max-width: 480px; margin: 15px auto 0; color: #bcc59a; }
.result-grid { display: grid; grid-template-columns: repeat(4, 1fr); margin: 29px 0 22px; padding: 22px 0; border-top: 1px solid #65704477; border-bottom: 1px solid #65704477; }
.result-grid > div { border-right: 1px solid #58653b; padding: 0 8px; }
.result-grid > div:last-child { border: none; }
.result-grid strong { display: block; font: 31px var(--serif); color: #ddbe7f; }
.result-grid span { display: block; margin-top: 6px; color: #a9bd8e; font-size: 7px; letter-spacing: .8px; }
.result-clock { color: #b8bd90; font-size: 11px; }
.result-clock .icon { color: #d0b674; width: 15px; height: 15px; margin-right: 6px; }
.end-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.end-modal > small { display: block; margin-top: 20px; color: #9fb68b; font-size: 10px; }
#notifications { position: fixed; right: 20px; top: 16px; width: min(440px, calc(100% - 40px)); display: grid; gap: 8px; z-index: 100; pointer-events: none; }
.toast { padding: 14px 18px; border: 1px solid #8b8751; background: #25381ef5; color: #e0ddb6; box-shadow: 0 5px 30px #0008; font-size: 12px; line-height: 1.75; animation: toast-in .18s ease-out; }
.toast.good { border-color: #88a06b; background: #243e21f5; }
.toast.warning { border-color: #b59956; background: #443e22f5; }
.toast.danger { border-color: #c49665; background: #4b3020f5; color: #f1d3ad; }
@keyframes toast-in { from { transform: translateY(-5px); opacity: .2; } to { transform: translateY(0); opacity: 1; } }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
.boot-error { max-width: 600px; padding: 50px 25px; margin: auto; }
.boot-error h1 { font-family: var(--serif); }
.boot-error p { margin: 20px 0; }
.boot-error button { padding: 12px 25px; color: #222d17; background: #cab678; border: 1px solid #e3d297; }

@media (min-width: 1600px) {
  .game-grid { grid-template-columns: 257px minmax(0, 1fr) 235px; gap: 24px; }
  .scene-wrap { height: 350px; }
  .anatomy-card { min-height: 220px; }
  .anatomy-card h3 { font-size: 16px; }
  .anatomy-card p { font-size: 10px; }
  .card-art { flex-basis: 72px; height: 72px; }
  .body-slot { min-height: 70px; }
  .slot-content > strong { font-size: 12px; }
}
@media (max-width: 1220px) {
  .topbar { padding: 0 23px; }
  .header-middle { display: none; }
  .game-shell { padding-left: 20px; padding-right: 20px; }
  .game-grid { grid-template-columns: 204px minmax(0, 1fr) 190px; gap: 13px; }
  .anatomy-panel, .map-panel { padding-left: 11px; padding-right: 11px; }
  .status-bar { gap: 22px; grid-template-columns: 1.1fr 1.1fr 1.5fr .4fr; }
  .echoes-stat { display: none; }
  .subject-block .subtle { display: block; font-size: 9px; margin-top: 2px; }

    try { return localStorage.getItem(KEY); } catch (_) { return null; }
  };

  // URL first, then the stored choice. The browser language only ever selects
  // Spanish here, so anything else falls through to the same Spanish default.
  const active = normalize(new URLSearchParams(location.search).get('lang')) || normalize(stored()) || 'es';

  const lang = () => active;

  const t = (text, vars) => {
    const value = active === 'en' && dictionary[text] ? dictionary[text] : text;
    return vars ? value.replace(/\{(\w+)\}/g, (match, key) => (key in vars ? vars[key] : match)) : value;
  };

  const set = value => {
    const next = normalize(value);
    if (!next || next === active) return;
    try { localStorage.setItem(KEY, next); } catch (_) { /* A blocked store still allows the URL below. */ }
    const url = new URL(location.href);
    url.searchParams.delete('lang');
    location.replace(url.toString());
  };

  document.documentElement.lang = active;
  document.title = t(document.title);
  const description = document.querySelector('meta[name="description"]');
  if (description) description.content = t(description.content);

  return { lang, t, set };
})();

/* Reglas, torre procedural, reloj y guardado local. */
'use strict';

const T = window.DDLang.t;

window.DDGame = class extends EventTarget {
  constructor() {
    super();
    this.key = 'deadlock-deck.v1';
    this.storageAvailable = true;
    this.meta = {
      version: 1, runs: 0, deaths: 0, wins: 0, souls: 0, best: null,
      blueprints: ['skull', 'sutures', 'bone', 'legs'], skins: ['suture'],
      skin: 'suture', expansion: false, volume: 0.3, sfx: true,
      motion: !window.matchMedia('(prefers-reduced-motion: reduce)').matches
    };
    this.state = null;
    this.load();
    this.timer = window.setInterval(() => this.tick(), 200);
  }

  emit(type, detail = {}) {
    this.dispatchEvent(new CustomEvent(type, { detail }));
  }

  notice(text, tone = 'info') {
    this.emit('notice', { text, tone });
  }

  sound(name) {
    this.emit('sound', { name });
  }

  log(text) {
    if (!this.state) return;
    this.state.log.unshift(text);
    this.state.log = this.state.log.slice(0, 24);
  }

  load() {
    try {
      const raw = localStorage.getItem(this.key);
      if (!raw) return;
      const stored = JSON.parse(raw);
      if (stored.version !== 1 || !stored.meta) return;
      this.meta = { ...this.meta, ...stored.meta };
      this.meta.blueprints = this.meta.blueprints.filter(id => DDData.parts[id]);
      this.meta.skins = this.meta.skins.filter(id => DDData.skins[id]);
      if (!this.meta.skins.includes(this.meta.skin)) this.meta.skin = 'suture';
      const s = stored.state;
      if (s && s.body && s.map?.length === 16 && Number.isFinite(s.deadline)
          && Array.isArray(s.hand) && Array.isArray(s.inventory) && s.version === 1) {
        this.state = s;
      }
    } catch (_) {
      this.storageAvailable = false;
    }
  }

  save() {
    try {
      localStorage.setItem(this.key, JSON.stringify({ version: 1, meta: this.meta, state: this.state }));
    } catch (_) {
      if (this.storageAvailable) {
        this.storageAvailable = false;
        this.notice(T('El navegador no permite guardar. Esta sesión sigue siendo jugable.'), 'warning');
      }
    }
  }

  change() {
    this.save();
    this.emit('change');
  }

  random() {
    let t = this.state.rng += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    this.state.rng >>>= 0;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }

  pick(items) {
    return items[Math.floor(this.random() * items.length)];
  }

  shuffle(items) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(this.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  active() {
    return this.state && !['dead', 'won'].includes(this.state.phase);
  }

  remaining() {
    if (!this.state) return 360000;
    if (this.state.phase === 'won') return this.state.remainingAtEnd;
    if (this.state.phase === 'dead') return this.state.remainingAtEnd || 0;
    return Math.max(0, this.state.deadline - Date.now());
  }

  guard() {
    if (!this.active()) return false;
    if (this.remaining() <= 0) {
      this.finish(false, T('La torre se derrumbó. El reloj no concede segundas oportunidades; tu espíritu, sí.'));
      return false;
    }
    return true;
  }

  start() {
    const bytes = new Uint32Array(1);
    if (window.crypto?.getRandomValues) window.crypto.getRandomValues(bytes);
    else bytes[0] = Date.now() >>> 0;
    const seed = bytes[0] || 1;
    this.meta.runs++;
    this.state = {
      version: 1, seed, rng: seed, startedAt: Date.now(), deadline: Date.now() + 360000,
      phase: 'explore', floor: 0, current: 12, previous: 12, map: [],
      hp: 80, maxHp: 80, block: 0, energy: 3, body: {}, inventory: [],
      scraps: 16, potions: 2, coolants: 2, hand: [], draw: [], discard: [],
      enemy: null, turn: 1, uid: 0, shiftStage: 0, reward: null,
      stats: { kills: 0, grafts: 0, broken: 0, rooms: 1, discovered: 0 },
      log: [], origin: '', awarded: false
    };
    const bases = [
      { name: T('El ensamblado'), hp: 80, arm: 'scalpel', torso: 'sutures', head: 'skull', leg: 'legs' },
      { name: T('El estibador'), hp: 88, arm: 'bone', torso: 'iron', head: 'skull', leg: 'legs' },
      { name: T('El hambriento'), hp: 76, arm: 'bone', torso: 'sutures', head: 'jaw', leg: 'funeral' }
    ];
    const base = this.meta.runs === 1 ? bases[0] : this.pick(bases);
    this.state.origin = base.name;
    this.state.hp = this.state.maxHp = base.hp;
    const bodyIds = { head: base.head, torso: base.torso, armL: 'bone', armR: base.arm, legL: 'legs', legR: base.leg };
    for (const slot of DDData.slots) {
      const id = bodyIds[slot.id];
      this.state.body[slot.id] = { id, heat: 0, integrity: 100 };
      this.discover(id, false);
    }
    this.state.map = this.generateFloor(0);
    this.reveal(12);
    this.log(T('Has despertado. Encuentra la escalera al noreste. El reloj ya corre.'));
    this.log(T('{name}: otro cuerpo para un espíritu que se niega a morir.', { name: base.name }));
    this.sound('revive');
    this.change();
  }

  tick() {
    if (this.active()) {
      if (!this.guard()) return;
      const stage = this.remaining() < 120000 ? 2 : this.remaining() < 240000 ? 1 : 0;
      if (stage > this.state.shiftStage) {
        this.state.shiftStage = stage;
        this.shiftTower();
      }
    }
    this.emit('clock', { ms: this.remaining() });
  }

  neighbours(index) {
    const x = index % 4;
    const y = Math.floor(index / 4);
    return [y > 0 ? index - 4 : null, x < 3 ? index + 1 : null,
      y < 3 ? index + 4 : null, x > 0 ? index - 1 : null].filter(v => v !== null);
  }

  connect(map, a, b) {
    if (!map[a].links.includes(b)) map[a].links.push(b);
    if (!map[b].links.includes(a)) map[b].links.push(a);
  }

  path(map, start, end) {
    const queue = [start];
    const parent = new Map([[start, null]]);
    while (queue.length) {
      const current = queue.shift();
      if (current === end) break;
      for (const next of map[current].links) {
        if (!parent.has(next)) {
          parent.set(next, current);
          queue.push(next);
        }
      }
    }
    if (!parent.has(end)) return [];
    const result = [];
    for (let n = end; n !== null; n = parent.get(n)) result.unshift(n);
    return result;
  }

  generateFloor(floor) {
    const map = Array.from({ length: 16 }, (_, id) => ({
      id, links: [], type: 'corridor', visited: false, seen: false, resolved: false
    }));
    const visited = new Set([12]);
    const stack = [12];
    while (stack.length) {
      const current = stack[stack.length - 1];
      const choices = this.neighbours(current).filter(n => !visited.has(n));
      if (!choices.length) { stack.pop(); continue; }
      const next = this.pick(choices);
      this.connect(map, current, next);
      visited.add(next);
      stack.push(next);
    }
    for (let k = 0; k < 3; k++) {
      const a = Math.floor(this.random() * 16);
      this.connect(map, a, this.pick(this.neighbours(a)));
    }
    const route = this.path(map, 12, 3);
    for (const room of map) {
      const r = this.random();
      room.type = r < 0.25 ? 'combat' : r < 0.39 ? 'cache' : r < 0.5 ? 'trap'
        : r < 0.61 ? 'workshop' : r < 0.71 ? 'archive' : 'corridor';
    }
    // Two encounters on the escape route; optional rooms offer other risks and rewards.
    for (let i = 1; i < route.length - 1; i++) {
      map[route[i]].type = i === Math.floor(route.length * 0.35)
        || i === Math.floor(route.length * 0.68) ? 'combat' : 'corridor';
    }
    if (route.length > 4) {
      map[route[1]].type = floor === 0 ? 'cache' : 'workshop';
      map[route[route.length - 2]].type = floor === 2 ? 'cache' : 'archive';
    }
    map[12].type = 'start';
    map[12].visited = map[12].seen = map[12].resolved = true;
    map[3].type = floor === 2 ? 'boss' : 'stairs';
    map[3].seen = true;
    return map;
  }

  shiftTower() {
    const map = this.state.map;
    const closed = [];
    for (let a = 0; a < 16; a++) {
      for (const b of this.neighbours(a)) {
        if (a < b && !map[a].links.includes(b)) closed.push([a, b]);
      }
    }
    if (closed.length) {
      const added = this.pick(closed);
      this.connect(map, ...added);
      const edges = [];
      for (const room of map) {
        for (const b of room.links) {
          if (room.id < b && !(room.id === added[0] && b === added[1])) edges.push([room.id, b]);
        }
      }
      for (const [a, b] of this.shuffle(edges)) {
        map[a].links = map[a].links.filter(n => n !== b);
        map[b].links = map[b].links.filter(n => n !== a);
        if (this.path(map, a, b).length) break;
        this.connect(map, a, b);
      }
    }
    this.reveal(this.state.current);
    this.log(T('¡El derrumbe ha cambiado los pasillos! La salida sigue siendo accesible.'));
    this.notice(T('La torre se retuerce. Los pasillos han cambiado.'), 'warning');
    this.sound('collapse');
    this.emit('effect', { type: 'shake' });
    this.change();
  }

  reveal(index) {
    const map = this.state.map;
    map[index].seen = map[index].visited = true;
    for (const next of map[index].links) map[next].seen = true;
  }

  move(index) {
    if (!this.guard()) return;
    const s = this.state;
    if (s.phase !== 'explore') {
      this.notice(s.phase === 'combat' ? T('Resuelve el combate para seguir explorando.') : T('Resuelve esta sala antes de avanzar.'));
      return;
    }
    if (!s.map[s.current].links.includes(index)) return;
    s.previous = s.current;
    s.current = index;
    const room = s.map[index];
    if (!room.visited) s.stats.rooms++;
    this.reveal(index);
    for (const part of Object.values(s.body)) part.heat = Math.max(0, part.heat - 7);
    this.sound('step');
    if (!room.resolved) {
      if (room.type === 'combat' || room.type === 'boss') this.beginCombat(room.type === 'boss');
      else if (['cache', 'trap', 'workshop', 'archive'].includes(room.type)) s.phase = 'event';
      else room.resolved = true;
    }
    this.log(`${DDData.roomNames[room.type]} · ${DDData.floors[s.floor].small}.`);
    this.change();
  }

  moveDirection(direction) {
    if (!this.state) return;
    const current = this.state.current;
    const delta = { north: -4, east: 1, south: 4, west: -1 }[direction];
    const next = current + delta;
    if (this.neighbours(current).includes(next)) this.move(next);
  }

  ascend() {
    if (!this.guard()) return;
    const s = this.state;
    if (s.phase !== 'explore' || s.map[s.current].type !== 'stairs' || s.floor >= 2) return;
    s.floor++;
    s.map = this.generateFloor(s.floor);
    s.current = s.previous = 12;
    s.stats.rooms++;
    this.reveal(12);
    for (const part of Object.values(s.body)) part.heat = Math.max(0, part.heat - 15);
    this.log(T('Has alcanzado {name}.', { name: DDData.floors[s.floor].name }));
    this.sound('stairs');
    this.change();
  }

  discover(id, notify = true) {
    if (this.meta.blueprints.includes(id)) return false;
    this.meta.blueprints.push(id);
    if (this.state) this.state.stats.discovered++;
    if (notify) {
      this.notice(T('Plano descubierto: {name}. Lo conservarás al morir.', { name: DDData.parts[id].name }), 'good');
      this.log(T('Plano permanente descubierto: {name}.', { name: DDData.parts[id].name }));
    }
    return true;
  }

  addPart(id) {
    this.discover(id);
    const item = { uid: ++this.state.uid, id, heat: 0, integrity: 100 };
    this.state.inventory.push(item);
    return item;
  }

  collectCache() {
    if (!this.guard()) return;
    const s = this.state;
    const room = s.map[s.current];
    if (s.phase !== 'event' || room.type !== 'cache' || room.resolved) return;
    const amount = 9 + Math.floor(this.random() * 7);
    s.scraps += amount;
    s.potions++;
    s.coolants++;
    const ids = s.floor === 0 ? ['claw', 'scalpel', 'spider', 'iron'] : ['cannon', 'pistons', 'boiler', 'oracle'];
    const item = this.addPart(this.pick(ids));
    this.log(T('Recoges {amount} de chatarra, un suero, un refrigerante y {name}.', { amount, name: DDData.parts[item.id].name }));
    this.notice(T('+{amount} chatarra · +1 suero · +1 refrigerante · injerto en la bolsa', { amount }), 'good');
    room.resolved = true;
    s.phase = 'explore';
    this.sound('loot');
    this.change();
  }

  resolveTrap(choice) {
    if (!this.guard()) return;
    const s = this.state;
    const room = s.map[s.current];
    if (s.phase !== 'event' || room.type !== 'trap' || room.resolved) return;
    if (choice === 'scraps') {
      if (s.scraps < 5) { this.notice(T('Necesitas 5 de chatarra.')); return; }
      s.scraps -= 5;
      this.log(T('Desvías el vapor con una válvula improvisada.'));
    } else if (choice === 'legs') {
      const legs = ['legL', 'legR'].filter(key => s.body[key].id);
      if (!legs.length) { this.notice(T('Necesitas al menos una pierna intacta.')); return; }
      for (const key of legs) this.stress(key, 30, 12);
      this.log(T('Saltas sobre el vapor. Tus piernas absorben el esfuerzo.'));
    } else if (choice === 'cross') {
      s.hp -= 9 + s.floor * 2;
      this.log(T('Atraviesas el vapor. Tu carne paga el precio.'));
      this.sound('hurt');
    } else return;
    room.resolved = true;
    s.phase = 'explore';
    if (s.hp <= 0) this.finish(false, T('El vapor ha deshecho tus últimas suturas.'));
    else this.change();
  }

  searchArchive() {
    if (!this.guard()) return;
    const s = this.state;
    const room = s.map[s.current];
    if (s.phase !== 'event' || room.type !== 'archive' || room.resolved) return;
    const unknown = Object.keys(DDData.parts).filter(id => !this.meta.blueprints.includes(id)
      && (!DDData.parts[id].expansion || this.meta.expansion));
    if (unknown.length) this.discover(this.pick(unknown));
    else {
      s.scraps += 10;
      this.notice(T('Ya conoces estos planos. Recuperas 10 de chatarra.'), 'good');
    }
    room.resolved = true;
    s.phase = 'explore';
    this.sound('discover');
    this.change();
  }

  leaveWorkshop() {
    if (!this.guard()) return;
    const s = this.state;
    if (s.phase !== 'event' || s.map[s.current].type !== 'workshop') return;
    s.map[s.current].resolved = true;
    s.phase = 'explore';
    this.change();
  }

  atWorkshop() {
    return this.active() && this.state.map[this.state.current].type === 'workshop'
      && ['explore', 'event'].includes(this.state.phase);
  }

  craft(id) {
    if (!this.guard() || !this.atWorkshop()) { this.notice(T('Solo puedes fabricar en una estación de injertos.')); return; }
    const def = DDData.parts[id];
    if (!def || !this.meta.blueprints.includes(id) || (def.expansion && !this.meta.expansion)) return;
    const cost = 6 + def.tier * 5;
    if (this.state.scraps < cost) { this.notice(T('Necesitas {cost} de chatarra.', { cost }), 'warning'); return; }
    this.state.scraps -= cost;
    this.addPart(id);
    this.log(T('Has fabricado {name}. Está en tu bolsa de injertos.', { name: def.name }));
    this.notice(T('{name} añadido a la bolsa.', { name: def.name }), 'good');
    this.sound('graft');
    this.change();
  }

  repair() {
    if (!this.guard() || !this.atWorkshop()) return;
    if (this.state.scraps < 8) { this.notice(T('Necesitas 8 de chatarra.')); return; }
    const parts = Object.values(this.state.body).filter(p => p.id);
    if (!parts.some(p => p.integrity < 100 || p.heat > 0)) { this.notice(T('Tus injertos intactos ya están en perfecto estado.')); return; }
    this.state.scraps -= 8;
    for (const part of parts) {
      part.integrity = Math.min(100, part.integrity + 40);
      part.heat = 0;
    }
    this.log(T('La estación repara 40 de integridad y enfría tus injertos intactos.'));
    this.sound('graft');
    this.change();
  }

  equip(uid, slotId) {
    if (!this.guard()) return;
    const s = this.state;
    const slot = DDData.slots.find(v => v.id === slotId);
    const index = s.inventory.findIndex(item => item.uid === Number(uid));
    if (index < 0 || !slot) return;
    const item = s.inventory[index];
    if (DDData.parts[item.id].kind !== slot.kind) return;
    if (s.phase === 'combat' && s.energy < 1) { this.notice(T('Injertar durante el combate cuesta 1 de energía.')); return; }
    const old = s.body[slotId];
    s.inventory.splice(index, 1);
    if (old.id) s.inventory.push({ ...old, uid: ++s.uid });
    s.body[slotId] = { id: item.id, heat: item.heat, integrity: item.integrity };
    this.purgeSlot(slotId);
    if (s.phase === 'combat') {
      s.energy--;
      for (const card of this.cardsForSlot(slotId)) {
        if (s.hand.length < 7) s.hand.push(card);
        else s.draw.push(card);
      }
    }
    s.stats.grafts++;
    this.log(T('Injertas {name} en {slot}.', { name: DDData.parts[item.id].name, slot: slot.label.toLowerCase() }));
    this.notice(T('Injerto conectado. Tu cuerpo y tu mazo han cambiado.'), 'good');
    this.sound('graft');
    this.change();
  }

  salvage(uid) {
    if (!this.guard()) return;
    const s = this.state;
    const index = s.inventory.findIndex(item => item.uid === Number(uid));
    if (index < 0) return;
    const item = s.inventory.splice(index, 1)[0];
    const amount = DDData.parts[item.id].tier * 3;
    s.scraps += amount;
    this.notice(T('Injerto desguazado: +{amount} de chatarra.', { amount }), 'good');
    this.sound('loot');
    this.change();
  }

  useItem(kind) {
    if (!this.guard()) return;
    const s = this.state;
    if (kind === 'heal') {
      if (s.potions <= 0) { this.notice(T('No te quedan sueros.')); return; }
      if (s.hp >= s.maxHp) { this.notice(T('Tu vida ya está al máximo.')); return; }
      s.potions--;
      s.hp = Math.min(s.maxHp, s.hp + 28);
      this.log(T('Suero vital: recuperas hasta 28 de vida.'));
      this.sound('heal');
    } else if (kind === 'cool') {
      if (s.coolants <= 0) { this.notice(T('No te queda refrigerante.')); return; }
      if (!Object.values(s.body).some(p => p.id && (p.heat > 0 || p.integrity < 100))) {
        this.notice(T('No necesitas enfriar ni reparar ningún injerto.')); return;
      }
      s.coolants--;
      for (const part of Object.values(s.body)) {
        if (!part.id) continue;
        part.heat = Math.max(0, part.heat - 38);
        part.integrity = Math.min(100, part.integrity + 12);
      }
      this.log(T('Refrigerante: −38° y +12 de integridad en todos los injertos intactos.'));
      this.sound('cool');
    } else return;
    this.change();
  }

  cardsForSlot(slotId) {
    const slot = DDData.slots.find(v => v.id === slotId);
    const part = this.state.body[slotId];
    const fallback = { head: 'stumpHead', torso: 'stumpTorso', arm: 'stumpArm', leg: 'stumpLeg' };
    const ids = part.id ? DDData.parts[part.id].cards : [fallback[slot.kind]];
    return ids.map(id => ({ uid: ++this.state.uid, id, slot: slotId, part: part.id }));
  }

  fullDeck() {
    return DDData.slots.flatMap(slot => this.cardsForSlot(slot.id));
  }

  purgeSlot(slotId) {
    for (const zone of ['hand', 'draw', 'discard']) {
      this.state[zone] = this.state[zone].filter(card => card.slot !== slotId);
    }
  }

  stress(slotId, heat, wear) {
    const part = this.state.body[slotId];
    if (!part.id) return;
    part.heat = Math.min(100, part.heat + heat);
    part.integrity = Math.max(0, part.integrity - wear - (part.heat >= 75 ? 7 : 0));
    if (part.heat >= 100 || part.integrity <= 0) {
      const name = DDData.parts[part.id].name;
      this.state.body[slotId] = { id: null, heat: 0, integrity: 0 };
      this.state.stats.broken++;
      this.purgeSlot(slotId);
      if (this.state.phase === 'combat') this.state.draw.push(...this.cardsForSlot(slotId));
      this.notice(T('¡{name} se ha roto! Sus cartas desaparecen. Injerta un reemplazo.', { name }), 'danger');
      this.log(T('{name} se rompe. Solo queda un muñón.', { name }));
      this.sound('break');
      this.emit('effect', { type: 'break', slot: slotId });
    }
  }

  beginCombat(boss = false) {
    const s = this.state;
    let choices = s.floor === 0 ? ['orderly', 'scientist', 'stitched']
      : s.floor === 1 ? ['furnace', 'scientist', 'stitched'] : ['furnace', 'oracle', 'stitched'];
    if (this.meta.expansion) choices = [...choices, 'archivist'];
    const id = boss ? 'boss' : this.pick(choices);
    const def = DDData.enemies[id];
    const hp = def.hp + (boss ? 0 : s.floor * 7);
    s.enemy = { id, hp, maxHp: hp, block: 0, burn: 0, weak: 0, stun: 0, move: 0 };
    s.phase = 'combat';
    s.turn = 1;
    s.block = 0;
    s.energy = 3;
    s.hand = [];
    s.discard = [];
    s.draw = this.shuffle(this.fullDeck());
    this.drawCards(5);
    this.log(T('{name} te bloquea el paso. La intención enemiga está a la vista.', { name: def.name }));
    this.sound(boss ? 'boss' : 'combat');
  }

  drawCards(amount) {
    const s = this.state;
    for (let i = 0; i < amount && s.hand.length < 7; i++) {
      if (!s.draw.length) {
        if (!s.discard.length) break;
        s.draw = this.shuffle(s.discard);
        s.discard = [];
      }
      s.hand.push(s.draw.pop());
    }
  }

  intent() {
    const s = this.state;
    if (!s?.enemy) return null;
    const e = s.enemy;
    const def = DDData.enemies[e.id];
    const kind = def.pattern[e.move % def.pattern.length];
    const base = def.attack + (def.boss ? 0 : s.floor * 2) + (this.remaining() < 120000 ? 2 : 0);
    const damage = Math.floor(base * (kind === 'fury' ? 1.6 : 1) * (e.weak > 0 ? 0.6 : 1));
    if (e.stun > 0) return { kind: 'stunned', label: T('Aturdido · no actuará'), value: 0, icon: 'bolt' };
    if (kind === 'guard') return { kind, label: T('Se protegerá · 12 defensa'), value: 12, icon: 'shield' };
    if (kind === 'heat') return { kind, label: T('Vapor · +22° a un injerto'), value: 22, icon: 'flame' };
    return { kind, label: T('{move} · {damage} de daño', { move: T(kind === 'fury' ? 'Golpe brutal' : 'Atacará'), damage }), value: damage, icon: 'blade' };
  }

  play(uid) {
    if (!this.guard() || this.state.phase !== 'combat') return;
    const s = this.state;
    const index = s.hand.findIndex(card => card.uid === Number(uid));
    if (index < 0) return;
    const card = s.hand[index];
    if (s.body[card.slot].id !== card.part) { this.purgeSlot(card.slot); this.change(); return; }
    const def = DDData.cards[card.id];
    if (def.cost > s.energy) { this.notice(T('No tienes suficiente energía. Termina el turno para recuperar 3.')); return; }
    s.energy -= def.cost;
    s.hand.splice(index, 1);
    if (def.damage) {
      let hit = def.damage;
      if (!def.pierce) {
        const blocked = Math.min(s.enemy.block, hit);
        s.enemy.block -= blocked;
        hit -= blocked;
      }
      s.enemy.hp = Math.max(0, s.enemy.hp - hit);
      this.emit('effect', { type: 'hit', amount: hit, target: 'enemy' });
    }
    if (def.block) s.block += def.block;
    if (def.heal) s.hp = Math.min(s.maxHp, s.hp + def.heal);
    if (def.energy) s.energy += def.energy;
    if (def.burn) s.enemy.burn += def.burn;
    if (def.weak) s.enemy.weak = Math.max(s.enemy.weak, def.weak);
    if (def.stun) s.enemy.stun = 1;
    if (def.cool) {
      for (const part of Object.values(s.body)) part.heat = Math.max(0, part.heat - def.cool);
    }
    this.stress(card.slot, def.heat, def.wear);
    // A broken/replaced part must not return through the discard pile.
    if (s.body[card.slot].id === card.part) s.discard.push(card);
    if (def.draw) this.drawCards(def.draw);
    this.log(`${def.name}: ${def.text}`);
    this.sound(def.damage ? 'attack' : def.heal ? 'heal' : def.block ? 'guard' : 'card');
    if (s.enemy.hp <= 0) this.victory();
    this.change();
  }

  endTurn() {
    if (!this.guard() || this.state.phase !== 'combat') return;
    const s = this.state;
    const e = s.enemy;
    if (e.burn > 0) {
      e.hp = Math.max(0, e.hp - e.burn);
      this.emit('effect', { type: 'hit', target: 'enemy', amount: e.burn });
      this.log(T('La quemadura inflige {amount} de daño.', { amount: e.burn }));
      e.burn = Math.max(0, e.burn - 1);
      if (e.hp <= 0) { this.victory(); this.change(); return; }
    }
    const intent = this.intent();
    if (intent.kind === 'stunned') {
      this.log(T('El enemigo está aturdido. Su intención queda cancelada.'));
      e.stun = 0;
    } else if (intent.kind === 'guard') {
      e.block = Math.min(24, e.block + intent.value);
      this.log(T('El enemigo se protege con 12 de defensa.'));
      this.sound('guard');
    } else if (intent.kind === 'heat') {
      const slots = DDData.slots.filter(slot => s.body[slot.id].id);
      if (slots.length) {
        const slot = this.pick(slots);
        this.stress(slot.id, intent.value, 3);
        this.log(T('Una descarga de vapor recalienta tu {slot}.', { slot: slot.label.toLowerCase() }));
        this.sound('burn');
      }
    } else {
      const damage = Math.max(0, intent.value - s.block);
      s.hp = Math.max(0, s.hp - damage);
      this.log(T('El enemigo inflige {damage} de daño; tu defensa absorbe {blocked}.', { damage, blocked: Math.min(s.block, intent.value) }));
      this.emit('effect', { type: 'hit', target: 'player', amount: damage });
      this.sound(damage ? 'hurt' : 'guard');
    }
    if (s.hp <= 0) { this.finish(false, T('Tus suturas han cedido. La carne se queda; el espíritu continúa.')); return; }
    e.move++;
    e.weak = Math.max(0, e.weak - 1);
    for (const part of Object.values(s.body)) part.heat = Math.max(0, part.heat - 12);
    s.discard.push(...s.hand);
    s.hand = [];
    s.block = 0;
    s.energy = 3;
    s.turn++;
    this.drawCards(5);
    this.change();
  }

  victory() {
    const s = this.state;
    const def = DDData.enemies[s.enemy.id];
    const amount = 7 + s.floor * 3;
    const item = this.addPart(this.pick(def.loot));
    s.scraps += amount;
    s.hp = Math.min(s.maxHp, s.hp + 5);
    s.stats.kills++;
    s.map[s.current].resolved = true;
    s.reward = { id: item.id, uid: item.uid, scraps: amount, enemy: def.name, boss: Boolean(def.boss) };
    s.phase = 'loot';
    s.block = 0;
    this.log(T('{enemy} cae. Cosechas {name}, {amount} de chatarra y 5 de vida.', { enemy: def.name, name: DDData.parts[item.id].name, amount }));
    this.sound('victory');
  }

  continueAfterLoot() {
    if (!this.guard() || this.state.phase !== 'loot') return;
    const s = this.state;
    s.phase = 'explore';
    s.hand = s.draw = s.discard = [];
    s.enemy = null;
    this.change();
  }

  escape() {
    if (!this.guard()) return;
    const s = this.state;
    if (s.floor !== 2 || s.current !== 3 || !s.map[3].resolved || s.phase !== 'explore') return;
    this.finish(true, T('Sales de la torre mientras el cielo se llena de ceniza. Este cuerpo, por fin, te pertenece.'));
  }

  finish(won, reason) {
    if (!this.active()) return;
    const s = this.state;
    s.remainingAtEnd = Math.max(0, s.deadline - Date.now());
    s.phase = won ? 'won' : 'dead';
    s.reason = reason;
    if (!s.awarded) {
      s.awarded = true;
      s.earnedSouls = 3 + s.stats.kills + s.floor * 2 + (won ? 15 : 0);
      this.meta.souls += s.earnedSouls;
      if (won) {
        this.meta.wins++;
        const elapsed = 360000 - s.remainingAtEnd;
        this.meta.best = this.meta.best === null ? elapsed : Math.min(this.meta.best, elapsed);
      } else this.meta.deaths++;
    }
    this.log(reason);
    this.sound(won ? 'escape' : 'death');
    this.change();
  }

  buy(id) {
    if (id === 'expansion') {
      if (this.meta.expansion) return;
      if (this.meta.souls < 30) { this.notice(T('Necesitas 30 ecos. Los obtienes al terminar cada intento.')); return; }
      this.meta.souls -= 30;
      this.meta.expansion = true;
      this.notice(T('Ala prohibida abierta. Su archivista puede aparecer en los próximos encuentros.'), 'good');
    } else {
      const skin = DDData.skins[id];
      if (!skin) return;
      if (!this.meta.skins.includes(id)) {
        if (this.meta.souls < skin.cost) { this.notice(T('Necesitas {cost} ecos.', { cost: skin.cost })); return; }
        this.meta.souls -= skin.cost;
        this.meta.skins.push(id);
      }
      this.meta.skin = id;
      this.notice(T('Apariencia equipada: {name}.', { name: skin.name }), 'good');
    }
    this.sound('discover');
    this.change();
  }

  setPreference(name, value) {
    if (!['volume', 'sfx', 'motion'].includes(name)) return;
    this.meta[name] = name === 'volume' ? Math.max(0, Math.min(1, Number(value))) : Boolean(value);
    this.save();
    this.emit('preference');
  }
};

  <script>
/* Pixel art original dibujado en lienzos de baja resolución. */
'use strict';

window.DDArt = class {
  constructor(game) {
    this.game = game;
    this.canvas = null;
    this.anatomy = null;
    this.effects = [];
    this.backgrounds = new Map();
    this.sprite = document.createElement('canvas');
    this.sprite.width = 100;
    this.sprite.height = 116;
    this.last = 0;
    game.addEventListener('effect', event => {
      this.effects.push({ ...event.detail, time: performance.now() });
    });
    const frame = now => {
      if (now - this.last > 40) {
        this.last = now;
        this.draw(now);
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  bind() {
    this.canvas = document.getElementById('scene');
    this.anatomy = document.getElementById('body-canvas');
    this.draw(performance.now());
  }

  rect(c, x, y, w, h, color) {
    c.fillStyle = color;
    c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  line(c, x1, y1, x2, y2, color, width = 1) {
    c.strokeStyle = color;
    c.lineWidth = width;
    c.beginPath();
    c.moveTo(Math.round(x1) + 0.5, Math.round(y1) + 0.5);
    c.lineTo(Math.round(x2) + 0.5, Math.round(y2) + 0.5);
    c.stroke();
  }

  ellipse(c, x, y, rx, ry, color) {
    for (let py = -ry; py <= ry; py++) {
      const span = Math.floor(rx * Math.sqrt(Math.max(0, 1 - py * py / (ry * ry))));
      this.rect(c, x - span, y + py, span * 2 + 1, 1, color);
    }
  }

  arch(c, x, y, width, height) {
    const r = this.rect.bind(this, c);
    r(x - 3, y + 24, width + 6, height - 20, '#39372f');
    r(x + 2, y + 12, width - 4, height - 9, '#39372f');
    r(x + 10, y + 5, width - 20, height - 2, '#454035');
    r(x + 20, y, width - 40, 8, '#454035');
    r(x + 3, y + 27, width - 6, height - 25, '#0b1016');
    r(x + 7, y + 17, width - 14, height - 15, '#0b1016');
    r(x + 14, y + 10, width - 28, height - 8, '#0b1016');
    r(x + 23, y + 6, width - 46, 11, '#0b1016');
    for (let i = 0; i < 16; i++) {
      const px = x + 9 + (i * 17) % (width - 18);
      const py = y + 21 + (i * 19) % (height - 29);
      r(px, py, 1, 1, i % 4 === 0 ? '#ae9870' : '#484b53');
    }
    this.ellipse(c, x + width / 2 + 7, y + 34, 9, 9, '#aaa993');
    this.ellipse(c, x + width / 2 + 11, y + 30, 9, 9, '#0b1016');
    r(x + 5, y + height - 28, width - 10, 29, '#141a1c');
    for (let i = 0; i < 5; i++) {
      r(x + 7 + i * 10, y + height - 35 - (i % 2) * 7, 6, 24, '#141a1c');
      r(x + 9 + i * 10, y + height - 40 - (i % 2) * 7, 2, 10, '#141a1c');
    }
    r(x + width / 2 - 1, y + 9, 3, height - 5, '#504838');
    r(x + 4, y + 56, width - 8, 3, '#403c33');
    r(x - 6, y + height + 2, width + 12, 5, '#554b3c');
    r(x - 4, y + height + 7, width + 8, 3, '#262822');
  }

  background(floor, seed) {
    const key = `${floor}:${seed}`;
    if (this.backgrounds.has(key)) return this.backgrounds.get(key);
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 276;
    const c = canvas.getContext('2d');
    const r = this.rect.bind(this, c);
    r(0, 0, 512, 276, '#151817');
    const bricks = ['#202321', '#222522', '#252723', '#272924', '#1e2221'];
    for (let row = 0; row < 14; row++) {
      for (let col = -1; col < 18; col++) {
        const x = col * 32 + (row % 2) * 16;
        const y = row * 13;
        r(x, y, 30, 11, bricks[Math.abs((row * 31 + col * 17 + seed) % bricks.length)]);
        r(x + 2, y + 1, 25, 1, '#2b2d27');
      }
    }
    this.arch(c, 42, 26, 62, 109);
    this.arch(c, 224, 14, 64, 116);
    this.arch(c, 406, 26, 62, 109);
    for (const x of [16, 126, 196, 310, 382, 491]) {
      r(x, 0, 8, 178, '#1a1e1b');
      r(x + 1, 0, 2, 176, '#494337');
      r(x - 4, 167, 16, 13, '#38392f');
      r(x - 6, 178, 20, 5, '#444235');
      r(x - 3, 19, 14, 5, '#444235');
    }
    // Pipes, pressure gauges, gears and suspension chains.
    r(0, 8, 512, 5, '#554335');
    r(0, 8, 512, 1, '#816447');
    for (const x of [140, 362]) {
      r(x, 11, 5, 112, '#745539');
      r(x, 11, 1, 112, '#a07a4c');
      r(x - 2, 102, 9, 4, '#383a30');
      this.ellipse(c, x + 2, 57, 11, 11, '#161b18');
      this.ellipse(c, x + 2, 57, 8, 8, '#9f8050');
      this.ellipse(c, x + 2, 57, 6, 6, '#b8af8c');
      this.line(c, x + 2, 57, x + 5, 52, '#512f25');
      r(x - 3, 124, 16, 5, '#83633d');
    }
    for (const x of [170, 339]) {
      for (let y = 0; y < 62; y += 5) {
        r(x, y, 3, 4, '#645944');
        r(x + 1, y + 1, 1, 2, '#1a201d');
      }
      r(x - 10, 61, 23, 4, '#66533b');
      r(x - 6, 66, 14, 3, '#38372a');
    }
    // Stone floor, mosaic and ritual circle.
    r(0, 183, 512, 93, '#232620');
    for (let row = 0; row < 7; row++) {
      for (let col = -1; col < 13; col++) {
        const x = col * 48 + (row % 2) * 24;
        const y = 183 + row * 15;
        r(x, y, 46, 13, (row + col) % 3 === 0 ? '#2d2f26' : '#292c25');
        r(x + 2, y + 1, 39, 1, '#36372b');
      }
    }
    this.ellipse(c, 256, 230, 122, 31, '#41402d');
    this.ellipse(c, 256, 230, 120, 29, '#282c25');
    this.ellipse(c, 256, 230, 107, 25, '#514632');
    this.ellipse(c, 256, 230, 105, 24, '#282c25');
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2;
      const x = 256 + Math.cos(a) * 113;
      const y = 230 + Math.sin(a) * 27;
      this.line(c, x - 2, y - 2, x + 2, y + 2, '#89714a');
      r(x, y - 3, 1, 6, '#89714a');
    }
    this.line(c, 180, 216, 325, 240, '#574b32');
    this.line(c, 325, 216, 190, 240, '#574b32');
    this.line(c, 256, 205, 256, 254, '#574b32');
    // Alchemist's workbench.
    r(28, 164, 93, 8, '#675039');
    r(31, 171, 4, 27, '#443d2e');
    r(112, 171, 4, 27, '#443d2e');
    r(30, 166, 88, 2, '#9b7750');
    for (let i = 0; i < 5; i++) {
      const x = 37 + i * 16;
      r(x + 3, 142 - i % 2 * 8, 4, 8, '#606b58');
      r(x, 149 - i % 2 * 8, 11, 14 + i % 2 * 8, '#45594a');
      r(x + 2, 153, 7, 8, ['#78a28d', '#b48b52', '#a96d58'][i % 3]);
      r(x + 1, 148 - i % 2 * 8, 2, 7, '#9aab87');
    }
    // Holding tank with something imperfectly alive inside.
    r(423, 134, 39, 45, '#303b31');
    r(426, 137, 33, 39, '#35554a');
    r(430, 140, 2, 29, '#718b6a');
    r(419, 131, 47, 5, '#7d6544');
    r(419, 177, 47, 5, '#7d6544');
    this.ellipse(c, 444, 150, 7, 8, '#84947b');
    r(439, 157, 10, 13, '#6b806b');
    r(439, 148, 2, 2, '#232c24');
    r(446, 148, 2, 2, '#232c24');
    // Loose bones, books and rubble, deterministic rather than noisy.
    for (let i = 0; i < 30; i++) {
      const x = (i * 73 + seed % 51) % 508;
      const y = 192 + (i * 17) % 78;
      r(x, y, 3 + i % 4, 2, i % 4 === 0 ? '#79694b' : '#373a2e');
    }
    if (floor === 1) {
      r(218, 35, 75, 130, '#30271e');
      r(223, 40, 65, 120, '#796046');
      r(228, 48, 55, 104, '#261f18');
      r(233, 92, 45, 55, '#8b4127');
      r(238, 105, 35, 42, '#bd6a2e');
      for (const x of [234, 244, 254, 264, 274]) r(x, 51, 3, 99, '#3c3427');
    }
    if (floor === 2) {
      for (let i = 0; i < 8; i++) {
        const x = 150 + i * 29;
        r(x, 152 - i % 2 * 6, 18, 25, '#463331');
        r(x + 2, 156 - i % 2 * 6, 2, 17, '#a0814e');
      }
      r(146, 177, 246, 5, '#806345');
    }
    // Soft vignette applied at source resolution, never blurring the sprites.
    const vignette = c.createRadialGradient(256, 146, 85, 256, 146, 285);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.58)');
    c.fillStyle = vignette;
    c.fillRect(0, 0, 512, 276);
    if (this.backgrounds.size > 6) this.backgrounds.clear();
    this.backgrounds.set(key, canvas);
    return canvas;
  }

  flame(c, x, y, tick, big = false) {
    const r = this.rect.bind(this, c);
    const phase = Math.floor(tick / 140 + x) % 4;
    const height = big ? 32 : 17;
    r(x - 3, y - height + phase * 2, 4, height - phase * 2, '#8c482b');
    r(x + 2, y - height + 7 - phase, 6, height - 7 + phase, '#a1532a');
    r(x - 1, y - height + 6 + phase, 5, height - 6 - phase, '#d9913e');
    r(x, y - 7 - phase, 3, 8 + phase, '#edc477');
    r(x + 1, y - 2, 2, 3, '#f4dda1');
  }

  defaultBody() {
    const ids = { head: 'skull', torso: 'sutures', armL: 'bone', armR: 'scalpel', legL: 'legs', legR: 'legs' };
    return Object.fromEntries(Object.entries(ids).map(([key, id]) => [key, { id, heat: 0, integrity: 100 }]));
  }

  drawBody(target, cx, ground, scale, body, tick, skinId = 'suture', attack = false) {
    const sc = this.sprite.getContext('2d');
    sc.clearRect(0, 0, 100, 116);
    const r = this.rect.bind(this, sc);
    const skin = DDData.skins[skinId]?.color || '#8fa58e';
    const dark = '#3c4e43';
    const shadow = '#121b18';
    const light = '#b3ba92';
    const bob = this.game.meta.motion ? Math.floor(Math.sin(tick / 430)) : 0;
    const color = key => body[key]?.id ? DDData.parts[body[key].id].color : '#7f4e46';
    // Feet and legs are independent anatomical slots.
    for (const [key, x] of [['legL', 32], ['legR', 51]]) {
      const id = body[key]?.id;
      if (!id) {
        r(x, 77, 10, 6, shadow);
        r(x + 2, 78, 7, 4, '#8d5850');
        r(x + 5, 82, 3, 13, '#a69476');
        r(x + 2, 95, 8, 3, '#756b54');
      } else if (['pistons', 'spider'].includes(id)) {
        r(x - 1, 77, 13, 8, shadow);
        r(x, 78, 11, 6, color(key));
        r(x + 2, 84, 3, 14, '#a4aca0');
        r(x + 7, 84, 2, 14, '#645d47');
        r(x - 2, 98, 16, 6, shadow);
        r(x - 1, 99, 13, 3, color(key));
        if (id === 'spider') { r(x - 7, 89, 5, 3, color(key)); r(x - 8, 92, 3, 9, color(key)); }
      } else {
        r(x - 2, 75, 15, 19, shadow);
        r(x, 76, 10, 19, id === 'legs' ? skin : color(key));
        r(x + 7, 78, 3, 15, dark);
        r(x + 1, 91, 10, 9, '#454e41');
        r(x - 3, 99, 17, 6, shadow);
        r(x - 2, 99, 14, 3, '#5c6250');
        r(x + 1, 83, 8, 1, '#594d3e');
        r(x + 3, 81, 1, 5, light);
        r(x + 6, 81, 1, 5, light);
      }
    }
    // Torso.
    const torso = body.torso?.id;
    const ty = 39 + bob;
    r(26, ty + 2, 43, 34, shadow);
    r(30, ty - 3, 34, 45, shadow);
    if (!torso) {
      r(33, ty + 2, 26, 30, '#5b463d');
      for (let i = 0; i < 5; i++) r(32, ty + 3 + i * 6, 30, 2, '#a79f82');
      r(45, ty, 3, 33, '#bead8d');
      r(47, ty + 13, 6, 9, '#8e554c');
    } else if (['boiler', 'iron', 'mercury'].includes(torso)) {
      r(28, ty + 3, 39, 29, color('torso'));
      r(31, ty - 1, 32, 39, color('torso'));
      r(34, ty + 3, 25, 29, '#41483c');
      r(37, ty + 6, 20, 22, '#1c2622');
      if (torso === 'boiler') {
        this.flame(sc, 46, ty + 26, tick, false);
        for (let i = 0; i < 4; i++) r(37 + i * 6, ty + 5, 2, 24, '#816143');
      } else if (torso === 'mercury') {
        this.ellipse(sc, 47, ty + 16, 7, 9, '#5d9997');
        r(45, ty + 10, 4, 9, '#acd4ba');
      } else {
        r(37, ty + 8, 20, 4, '#85948d');
        r(37, ty + 18, 20, 4, '#85948d');
        r(44, ty + 6, 5, 21, '#b8b7a0');
      }
      for (const x of [31, 62]) for (const y of [ty + 3, ty + 31]) r(x, y, 2, 2, '#d2c39c');
    } else {
      r(29, ty + 3, 36, 29, skin);
      r(32, ty - 1, 29, 39, skin);
      r(54, ty + 3, 9, 31, dark);
      r(31, ty + 3, 3, 25, light);
      r(35, ty + 5, 11, 9, '#a0ae8c');
      r(48, ty + 5, 12, 9, '#728a70');
      r(35, ty + 16, 20, 2, '#536651');
      r(45, ty + 3, 2, 31, '#5a463d');
      for (let y = ty + 4; y < ty + 31; y += 6) r(42, y, 8, 1, '#c7ba98');
      r(35, ty + 24, 8, 1, '#567052');
    }
    r(30, ty + 36, 34, 6, '#4a4234');
    r(44, ty + 37, 7, 5, '#bd9c60');
    // Arms, including cannon and surgical attachments.
    for (const [key, x] of [['armL', 17], ['armR', 65]]) {
      const id = body[key]?.id;
      const ay = ty + (key === 'armR' && attack ? -7 : 5);
      r(x - 2, ay - 2, 15, 28, shadow);
      if (!id) {
        r(x, ay, 11, 9, '#83594b');
        r(x + 4, ay + 9, 4, 5, '#b9a283');
      } else if (id === 'cannon' || id === 'piston') {
        r(x - 2, ay + 1, 17, 29, '#756044');
        r(x - 1, ay + 2, 14, 6, '#c69f63');
        r(x, ay + 9, 12, 4, '#bdab7a');
        r(x - 3, ay + 15, 18, 13, color(key));
        r(x - 1, ay + 18, 14, 8, '#34443c');
        r(x + 2, ay + 20, 8, 5, '#80b5a5');
        if (id === 'piston') r(x - 4, ay + 23, 20, 10, '#a59775');
      } else {
        r(x, ay, 11, 23, id === 'bone' ? skin : color(key));
        r(x + 8, ay + 2, 3, 20, '#5c6652');
        r(x + 1, ay + 6, 8, 2, '#b6b995');
        r(x - 1, ay + 21, 13, 6, '#b4aa85');
        if (id === 'scalpel') {
          r(x + 3, ay + 24, 3, 18, '#c4ccbe');
          r(x + 6, ay + 27, 2, 12, '#869891');
          r(x - 1, ay + 25, 2, 11, '#bec9c0');
        } else if (id === 'claw') {
          for (let i = 0; i < 3; i++) { r(x + i * 4, ay + 26, 2, 9 + i * 2, '#c2b18c'); r(x + i * 4 + 1, ay + 33 + i * 2, 3, 2, '#c2b18c'); }
        } else {
          r(x, ay + 27, 10, 7, '#8e9d7d');
          r(x + 1, ay + 30, 8, 2, '#4a5545');
        }
      }
    }
    // Head, neck bolts and eyes.
    const head = body.head?.id;
    const hy = 13 + bob;
    r(40, hy + 19, 15, 12, shadow);
    r(42, hy + 20, 11, 10, skin);
    if (!head) {

      for (const [x, y, right] of [[72, 31, false], [120, 64, true], [65, 87, false], [134, 87, true], [81, 119, false], [121, 119, true]]) {

  <script>
/* Banda sonora y foley originales sintetizados con Web Audio. */
'use strict';

window.DDAudio = class {
  constructor(game) {
    this.game = game;
    this.context = null;
    this.master = null;
    this.music = null;
    this.fx = null;
    this.sequence = 0;
    this.nextNote = 0;
    this.interval = null;
    this.noiseBuffer = null;
    game.addEventListener('sound', event => this.effect(event.detail.name));
    game.addEventListener('preference', () => this.update());
    document.addEventListener('visibilitychange', () => {
      if (this.context && document.hidden) this.context.suspend().catch(() => {});
      else if (this.context && this.unlocked) this.context.resume().catch(() => {});
    });
  }

  unlock() {
    try {
      if (!this.context) {
        const Audio = window.AudioContext || window.webkitAudioContext;
        if (!Audio) return;
        this.context = new Audio();
        this.master = this.context.createGain();
        this.music = this.context.createGain();
        this.fx = this.context.createGain();
        const compressor = this.context.createDynamicsCompressor();
        compressor.threshold.value = -16;
        compressor.ratio.value = 5;
        this.music.gain.value = 0.33;
        this.music.connect(this.master);
        this.fx.connect(this.master);
        this.master.connect(compressor);
        compressor.connect(this.context.destination);
        const buffer = this.context.createBuffer(1, this.context.sampleRate * 2, this.context.sampleRate);
        const data = buffer.getChannelData(0);
        let last = 0;
        for (let i = 0; i < data.length; i++) {
          last = (last + Math.random() * 0.05 - 0.025) / 1.02;
          data[i] = last * 8;
        }
        this.noiseBuffer = buffer;
        this.nextNote = this.context.currentTime;
        this.interval = setInterval(() => this.schedule(), 180);
      }
      this.unlocked = true;
      this.context.resume().catch(() => {});
      this.update();
    } catch (_) {
      this.game.notice(window.DDLang.t('El audio no está disponible en este navegador. El juego puede continuar.'));
    }
  }

  update() {
    if (!this.context) return;
    const now = this.context.currentTime;
    this.master.gain.setTargetAtTime(this.game.meta.volume, now, 0.08);
    this.fx.gain.setTargetAtTime(this.game.meta.sfx ? 0.75 : 0, now, 0.04);
  }

  tone(freq, start, duration, type = 'sine', volume = 0.1, output = null, endFrequency = null) {
    if (!this.context) return;
    const oscillator = this.context.createOscillator();
    const gain = this.context.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(freq, start);
    if (endFrequency) oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), start + duration);
    gain.gain.setValueAtTime(0.001, start);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.002, volume), start + Math.min(0.04, duration / 4));
    gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
    oscillator.connect(gain);
    gain.connect(output || this.fx);
    oscillator.start(start);
    oscillator.stop(start + duration + 0.03);
  }

  noise(duration, cutoff, volume = 0.25, resonance = 1, endCutoff = null) {
    if (!this.context || !this.noiseBuffer) return;
    const source = this.context.createBufferSource();
    const filter = this.context.createBiquadFilter();
    const gain = this.context.createGain();
    const now = this.context.currentTime;
    source.buffer = this.noiseBuffer;
    source.playbackRate.value = 0.75 + Math.random() * 0.3;
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(cutoff, now);
    if (endCutoff) filter.frequency.exponentialRampToValueAtTime(endCutoff, now + duration);
    filter.Q.value = resonance;
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(this.fx);
    source.start(now);
    source.stop(now + duration);
  }

  schedule() {
    if (!this.context || this.context.state !== 'running') return;
    const now = this.context.currentTime;
    if (this.nextNote < now - 1) this.nextNote = now;
    const danger = this.game.active() && this.game.remaining() < 60000;
    const combat = this.game.state?.phase === 'combat';
    const beat = danger ? 0.3 : combat ? 0.41 : 0.59;
    while (this.nextNote < now + 0.4) {
      const t = this.nextNote;
      const step = this.sequence++;
      const roots = [55, 55, 51.913, 58.27];
      const root = roots[Math.floor(step / 16) % roots.length];
      if (step % 8 === 0) {
        // Low string-like pad, a fifth and a dissonant upper layer.
        this.tone(root, t, beat * 9, 'triangle', 0.14, this.music);
        this.tone(root * 1.498, t + 0.04, beat * 8.5, 'sine', 0.065, this.music);
        this.tone(root * 2.012, t + 0.08, beat * 7.7, 'triangle', 0.035, this.music);
      }
      const arpeggio = [4, 3, 4.7568, 3.5636, 4, 5.0397, 3, 2.8284];
      if (step % 2 === 0 || combat) {
        this.tone(root * arpeggio[step % arpeggio.length], t, 0.55, 'sine', 0.075, this.music);
        this.tone(root * arpeggio[step % arpeggio.length] * 2, t, 0.2, 'triangle', 0.018, this.music);
      }
      if (step % 4 === 0 && this.game.active()) {
        this.tone(76, t, 0.3, 'sine', 0.22, this.music, 28);
        this.tone(49, t + 0.17, 0.17, 'sine', 0.13, this.music, 30);
      }
      // Mechanical clock ticks intensify as the tower approaches collapse.
      if (this.game.active()) this.tone(step % 2 ? 1530 : 1970, t, 0.025, 'square', danger ? 0.034 : 0.013, this.music);
      this.nextNote += beat;
    }
  }

  effect(name) {
    if (!this.context || this.context.state !== 'running' || !this.game.meta.sfx) return;
    const t = this.context.currentTime;
    const tone = (freq, duration, type, gain, end) => this.tone(freq, t, duration, type, gain, this.fx, end);
    if (name === 'attack') {
      this.noise(0.16, 1200, 0.5, 0.6, 130);
      tone(145, 0.18, 'sawtooth', 0.14, 45);
      tone(52, 0.21, 'sine', 0.3, 25);
    } else if (['hurt', 'death', 'break'].includes(name)) {
      this.noise(name === 'death' ? 1.2 : 0.4, 600, 0.65, 3.5, 90);
      tone(99, name === 'death' ? 1.3 : 0.38, 'sawtooth', 0.15, 28);
      tone(148, 0.35, 'triangle', 0.15, 52);
      if (name === 'break') this.noise(0.18, 3200, 0.6, 0.5);
    } else if (name === 'graft') {
      this.noise(0.45, 480, 0.7, 5, 1300);
      tone(83, 0.45, 'sawtooth', 0.12, 156);
      this.tone(660, t + 0.3, 0.2, 'sine', 0.12);
    } else if (['heal', 'cool'].includes(name)) {
      this.noise(0.5, name === 'cool' ? 2600 : 620, 0.22, 0.8, 1400);
      tone(330, 0.45, 'sine', 0.1, 660);
    } else if (name === 'guard') {
      tone(440, 0.23, 'triangle', 0.18, 220);
      tone(713, 0.21, 'sine', 0.1, 510);
    } else if (['loot', 'discover', 'victory', 'escape', 'revive', 'stairs'].includes(name)) {
      const notes = name === 'escape' ? [220, 261.63, 329.63, 440, 523.25] : [164.81, 220, 261.63, 329.63];
      notes.forEach((freq, i) => this.tone(freq, t + i * 0.09, 0.65, 'triangle', 0.105));
      if (name === 'revive') this.noise(0.8, 210, 0.35, 4, 960);
    } else if (['collapse', 'boss', 'combat', 'burn'].includes(name)) {
      this.noise(name === 'collapse' ? 1.6 : 0.55, 170, 0.8, 0.4);
      tone(59, 0.9, 'sawtooth', 0.16, 29);
    } else if (name === 'step') {
      this.noise(0.07, 460, 0.25, 0.8);
      tone(79, 0.08, 'sine', 0.12, 45);
    } else {
      this.noise(0.06, 1600, 0.12, 0.6);
      tone(520, 0.07, 'triangle', 0.06, 340);
    }
  }
};
